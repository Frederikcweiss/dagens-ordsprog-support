<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support – Dagens Ordsprog</title>
<style>
:root{
  --bg:#f7f3ea;
  --card:#fbf8f1;
  --text:#1e1e1c;
  --muted:#7b7973;
  --line:#ded9cf;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  line-height:1.55;
}
main{
  max-width:760px;
  margin:0 auto;
  padding:64px 24px 80px;
}
.brand{
  font-family:"Times New Roman",Times,serif;
  font-size:42px;
  font-weight:400;
  margin:0 0 8px;
}
.subtitle{color:var(--muted); margin:0 0 40px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:24px;
  padding:28px;
  margin:18px 0;
}
h2{
  font-family:"Times New Roman",Times,serif;
  font-size:28px;
  font-weight:400;
  margin:0 0 14px;
}
p{margin:10px 0}
a{color:inherit}
nav{margin-top:34px; display:flex; gap:18px; flex-wrap:wrap}
nav a{
  text-decoration:none;
  border-bottom:1px solid var(--text);
}
.small{font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1 class="brand">Support</h1>
  <p class="subtitle">Dagens Ordsprog</p>

  <section class="card">
    <h2>Kontakt</h2>
    <p>Har du spørgsmål, forslag eller oplever du et problem i appen, kan du kontakte os på:</p>
    <p><strong>E-mail:</strong> <a href="mailto:DIN-EMAIL@EKSEMPEL.DK">DIN-EMAIL@EKSEMPEL.DK</a></p>
    <p>Beskriv gerne hvilken iPhone-model og iOS-version du bruger, hvis henvendelsen handler om en fejl.</p>
  </section>

  <nav>
    <a href="index.html">Forside</a>
    <a href="privacy.html">Privatlivspolitik</a>
  </nav>
</main>
</body>
</html>
